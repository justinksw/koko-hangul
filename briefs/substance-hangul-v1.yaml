random_pool:
- id: cons-g
  char: ㄱ
  kind: consonant
  summary_zh: 讀音介乎 g／k。字首常偏軟（接近 g），字尾收成 k 音。與送氣的 ㅋ、緊音 ㄲ 成一組對照。
  vocab:
  - word: 가방
    meaning_zh: 書包
    highlight: [가]
  - word: 가다
    meaning_zh: 去
    highlight: [가]
  - word: 고기
    meaning_zh: 肉
    highlight: [고]
  - word: 고양이
    meaning_zh: 貓
    highlight: [고]
  - word: 학교
    meaning_zh: 學校
    highlight: [학]
- id: cons-n
  char: ㄴ
  kind: consonant
  summary_zh: 讀 n，像粵語「你」的聲母。字首、字尾都常見，發音穩定好記。
  vocab:
  - word: 나
    meaning_zh: 我
    highlight: [나]
  - word: 남자
    meaning_zh: 男人
    highlight: [남]
  - word: 노래
    meaning_zh: 歌
    highlight: [노]
  - word: 눈
    meaning_zh: 眼睛；雪
    highlight: [눈]
  - word: 오늘
    meaning_zh: 今天
    highlight: [늘]
- id: cons-d
  char: ㄷ
  kind: consonant
  summary_zh: 讀音介乎 d／t。字首偏軟（接近 d），字尾常收成 t。對照送氣 ㅌ、緊音 ㄸ。
  vocab:
  - word: 다
    meaning_zh: 都；全部
    highlight: [다]
  - word: 달
    meaning_zh: 月亮
    highlight: [달]
  - word: 다리
    meaning_zh: 腿；橋
    highlight: [다]
  - word: 동생
    meaning_zh: 弟弟／妹妹（同輩較年幼）
    highlight: [동]
  - word: 먹다
    meaning_zh: 吃
    highlight: [다]
- id: cons-r
  char: ㄹ
  kind: consonant
  summary_zh: 字首多像輕彈的 r；字中、字尾常像 l。初學先記「彈舌輕一點的 r／l」即可。
  vocab:
  - word: 라디오
    meaning_zh: 收音機
    highlight: [라]
  - word: 머리
    meaning_zh: 頭；頭髮
    highlight: [리]
  - word: 물
    meaning_zh: 水
    highlight: [물]
  - word: 사랑
    meaning_zh: 愛
    highlight: [랑]
  - word: 오늘
    meaning_zh: 今天
    highlight: [늘]
- id: cons-m
  char: ㅁ
  kind: consonant
  summary_zh: 讀 m，像「媽」的聲母。字形像嘴巴，好記。
  vocab:
  - word: 마시다
    meaning_zh: 喝
    highlight: [마]
  - word: 엄마
    meaning_zh: 媽媽
    highlight: [마]
  - word: 물
    meaning_zh: 水
    highlight: [물]
  - word: 마음
    meaning_zh: 心；心情
    highlight: [마]
  - word: 이름
    meaning_zh: 名字
    highlight: [름]
- id: cons-b
  char: ㅂ
  kind: consonant
  summary_zh: 讀音介乎 b／p。字首偏軟（接近 b），字尾常收成 p。對照送氣 ㅍ、緊音 ㅃ。
  vocab:
  - word: 밥
    meaning_zh: 飯
    highlight: [밥]
  - word: 비
    meaning_zh: 雨
    highlight: [비]
  - word: 버스
    meaning_zh: 巴士
    highlight: [버]
  - word: 보다
    meaning_zh: 看
    highlight: [보]
  - word: 가방
    meaning_zh: 書包
    highlight: [방]
- id: cons-s
  char: ㅅ
  kind: consonant
  summary_zh: 讀 s；接 ㅣ 或 y 類母音時會偏像「sh」。字尾常收成 t 音。對照緊音 ㅆ。
  vocab:
  - word: 사람
    meaning_zh: 人
    highlight: [사]
  - word: 수박
    meaning_zh: 西瓜
    highlight: [수]
  - word: 시간
    meaning_zh: 時間
    highlight: [시]
  - word: 선생님
    meaning_zh: 老師
    highlight: [선]
  - word: 음식
    meaning_zh: 食物
    highlight: [식]
- id: cons-ng
  char: ㅇ
  kind: consonant
  summary_zh: 字首幾乎不發音，只佔位子音位置（例如 아＝a）；字尾讀 ng（像「昂」的尾音）。
  vocab:
  - word: 아이
    meaning_zh: 小孩
    highlight: [아]
  - word: 오다
    meaning_zh: 來
    highlight: [오]
  - word: 이름
    meaning_zh: 名字
    highlight: [이]
  - word: 방
    meaning_zh: 房間
    highlight: [방]
  - word: 강
    meaning_zh: 江；河
    highlight: [강]
- id: cons-j
  char: ㅈ
  kind: consonant
  summary_zh: 讀 j（像「這」）。對照送氣 ㅊ、緊音 ㅉ。
  vocab:
  - word: 자다
    meaning_zh: 睡覺
    highlight: [자]
  - word: 집
    meaning_zh: 家
    highlight: [집]
  - word: 저
    meaning_zh: 我（謙稱）
    highlight: [저]
  - word: 진짜
    meaning_zh: 真的
    highlight: [진]
  - word: 주세요
    meaning_zh: 請給我
    highlight: [주]
- id: cons-ch
  char: ㅊ
  kind: consonant
  summary_zh: 讀 ch（送氣，像「車」）。比 ㅈ 多一股氣。
  vocab:
  - word: 차
    meaning_zh: 茶；車
    highlight: [차]
  - word: 친구
    meaning_zh: 朋友
    highlight: [친]
  - word: 책
    meaning_zh: 書
    highlight: [책]
  - word: 아침
    meaning_zh: 早上
    highlight: [침]
  - word: 춤
    meaning_zh: 舞
    highlight: [춤]
- id: cons-k
  char: ㅋ
  kind: consonant
  summary_zh: 送氣的 k（像「可」），氣流比 ㄱ 明顯。外來語常見。
  vocab:
  - word: 커피
    meaning_zh: 咖啡
    highlight: [커]
  - word: 코
    meaning_zh: 鼻子
    highlight: [코]
  - word: 카메라
    meaning_zh: 相機
    highlight: [카]
  - word: 키
