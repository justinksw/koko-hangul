    highlight: [키]
  - word: 쿠키
    meaning_zh: 曲奇
    highlight: [쿠]
- id: cons-t
  char: ㅌ
  kind: consonant
  summary_zh: 送氣的 t（像「他」），氣流比 ㄷ 明顯。
  vocab:
  - word: 타다
    meaning_zh: 搭乘；騎
    highlight: [타]
  - word: 토끼
