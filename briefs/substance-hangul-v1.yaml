meta:
  title: koko-hangul substance v1
  audience: beginner
  author: Koko
  date: '2026-11-05'
  scope_zh: 初學者韓文字母：基本子音14＋基本母音10為必學；雙子音／複合母音列於字表作進階參考，v1 隨機練習池只含基本24個字母。
  notes_zh: 複合母音收常用11個：ㅐㅔㅒㅖㅘㅙㅚㅝㅞㅟㅢ。雙子音收ㄲㄸㅃㅆㅉ。隨機池（random_pool）暫不含雙子音與複合母音。
  random_pool_scope_zh: 只含 basic_consonants＋basic_vowels 共24項；每項5個初級詞彙。
