<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>韓語字母 · 練習</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="site-wrap">
      <header class="site-header">
        <h1 class="site-title">韓語字母</h1>
        <nav class="site-nav" aria-label="主要導覽">
          <a class="nav-link is-current" href="./" aria-current="page">練習</a>
          <a class="nav-link" href="table/">字表</a>
        </nav>
      </header>

      <main aria-live="polite">
        <div class="letter-well">
          <p class="char-main" id="char-main" lang="ko">ㄱ</p>
          <p class="char-meta" id="char-meta" hidden></p>
        </div>
        <p class="summary-zh" id="summary-zh"></p>
        <section class="vocab-block">
          <h2 class="vocab-heading">例詞</h2>
          <ul class="vocab-list" id="vocab-list"></ul>
        </section>
        <div class="btn-row">
          <button type="button" class="btn-next" id="btn-next">下一個</button>
        </div>
      </main>
    </div>
    <script type="module" src="assets/js/practice.js"></script>
